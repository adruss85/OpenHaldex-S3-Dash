; =====================================================================
; OpenHaldex S3 Dash - native dashboard firmware for the Elecrow
; CrowPanel 7.0" (ESP32-S3, 800x480 RGB panel, 8 MB OPI PSRAM, 4 MB flash)
;
; This is a SEPARATE project from OpenHaldex-C6. It reads the controller's
; published data and modifies nothing on it:
;   ESP-NOW OHX_STATUS  10 Hz   fast values (rpm/speed/throttle/boost/locks)
;   ESP-NOW CAN relay           the car's frames, when switched on at the controller
;   GET /api/live     0-1 Hz    coolant and oil without the relay, everything if packets stop
;   GET /api/dashboard 0.5-1 Hz brake / warning lamps
; The C6 firmware needs NO changes.
; =====================================================================

[platformio]
default_envs = s3-dash
description = OpenHaldex S3 dash (CrowPanel 7.0" ESP32-S3)

[env:s3-dash]
; Same platform release the OpenHaldex-C6 firmware uses, so both projects
; build against an identical esp-idf / arduino-esp32 toolchain.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

; ---- flash / PSRAM -------------------------------------------------
; 4 MB quad flash, 8 MB OCTAL (OPI) PSRAM.
; OPI PSRAM is mandatory: the RGB panel needs two 800x480x16bpp frame
; buffers = 1.50 MB, and they must be reachable by the LCD DMA engine.
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304
board_build.f_cpu = 240000000L
board_build.partitions = partitions_4mb_ota.csv

; CH340 USB-UART bridge on this board: 460800 is its reliable ceiling.
; 921600 fails with "Invalid SLIP escape".
upload_speed = 460800
monitor_speed = 115200
monitor_filters =
    esp32_exception_decoder
    colorize

build_flags =
    -Iinclude
    ; lv_conf.h lives in include/ and is picked up by every compilation unit
    -DLV_CONF_INCLUDE_SIMPLE
    ; The generated fonts in src/ui/fonts include either "lvgl.h" or
    ; "lvgl/lvgl.h" depending on this; LVGL itself is the only lib_dep that
    ; puts its header on the include path at the top level.
    -DLV_LVGL_H_INCLUDE_SIMPLE
    -DBOARD_HAS_PSRAM
    ; There is no native USB on this board (GPIO19/20 are the I2C bus), so
    ; Serial must stay on UART0 -> CH340. The board description already sets
    ; ARDUINO_USB_MODE; redefining it here only produced a warning.
    -DARDUINO_USB_CDC_ON_BOOT=0
    ; WARN is enough to see the core's "Reason: %u - %s" line when a WiFi
    ; association is refused; ERROR (the default) hides exactly the one line
    ; that explains why a join failed. Drop back to 1 once joining is solid.
    -DCORE_DEBUG_LEVEL=3
    ; ESP-NOW listener (src/net/ohx_now.cpp): receives and decodes the C6's
    ; OHX_STATUS broadcast, which is the primary source of the numbers on the
    ; glass. 0 compiles a build that only ever uses HTTP - the listener is not
    ; initialised at all.
    -DOHX_USE_ESP_NOW=1

; The boot splash's background: an 800x480 baseline JPEG, decoded at
; runtime by the ESP32-S3's mask ROM (see src/ui/splash_img.cpp).
board_build.embed_files = assets/candash-splash-base-92.jpg

lib_deps =
    ; The RGB panel is driven with ESP-IDF's esp_lcd peripheral directly
    ; (see src/hal/crowpanel.cpp), so no display driver library is needed.
    lvgl/lvgl@9.3.0
    tamctec/TAMC_GT911@1.0.2
    ; /api/* responses are parsed with the same library the C6 uses.
    bblanchon/ArduinoJson@^7.0.0
